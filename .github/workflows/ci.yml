name: OpsPilot CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests-and-evals:
    name: Backend Pytest & AI Evaluations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install backend dependencies
        run: |
          cd backend
          uv sync --all-groups

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          uv run pytest -v

      - name: Run 50-Case AI Evaluation Benchmark Suite
        run: |
          cd backend
          uv run python ../evals/scripts/run_evals.py

  frontend-build:
    name: Frontend Vite & TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend with Vite
        run: |
          cd frontend
          npm run build
