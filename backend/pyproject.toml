[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "boto3>=1.43.110",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "langchain-core>=1.6.6",
    "langgraph>=1.2.13",
    "numpy>=2.5.3",
    "passlib>=1.7.4",
    "pillow>=12.3.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-docx>=1.2.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]

